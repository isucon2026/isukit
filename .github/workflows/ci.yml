name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pinned image, same command as locally: no tool to install for the team
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 -S warning \
            isukit install.sh launch/*.sh remote/*.sh test/*.sh test/e2e/*.sh \
            test/bin/docker test/bin/sudo test/bin/supervisorctl test/bin/free test/bin/nproc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: offline suites (probe / bench / etc / hosts / alp)
        run: bash test/run-all.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: end-to-end scenarios in throwaway ubuntu containers
        run: bash test/e2e/run.sh
